# GitHub Actions Workflow for vlm_learn Project Security Auditing
# This workflow runs a security audit on Python dependencies using pip-audit.
# It is configured to ignore specific unpatched vulnerabilities and allow
# for missing packages to ensure the CI/CD pipeline remains functional.

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to catch new CVEs in existing dependencies
    - cron: '0 0 * * 0'

jobs:
  audit:
    # Using windows-latest to mirror the local development environment
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We attempt to install requirements but use '|| true' to prevent 
          # build failures from complex wheels like llama-cpp-python.
          if (Test-Path requirements.txt) { pip install -r requirements.txt || true }

      - name: Run pip-audit and Generate HTML
        run: |
          pip install pip-audit markdown
          # 1. --ignore-vuln CVE-2025-69872: Bypasses the unpatched diskcache issue.
          # 2. --allow-not-found: Prevents Exit Code 1 if llama-cpp-python is skipped.
          # 3. || true: Ensures the markdown conversion runs even if the audit finds issues.
          pip-audit --local -f markdown `
            --ignore-vuln CVE-2025-69872 `
            --allow-not-found `
            -o audit_report.md || true
          
          python -m markdown audit_report.md > security-report.html

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        run: |
          # This step serves as the definitive success/failure check.
          # It fails the build ONLY if NEW, un-ignored vulnerabilities are detected.
          pip-audit --local `
            --ignore-vuln CVE-2025-69872 `
            --allow-not-found