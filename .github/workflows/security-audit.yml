# GitHub Actions Workflow for VLM Project Security Auditing
# This workflow runs a security audit on Python dependencies using pip-audit.
# It is configured to ignore specific unpatched vulnerabilities and handle
# missing dependencies to ensure the CI/CD pipeline remains functional.

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to catch new CVEs in existing dependencies
    - cron: '0 0 * * 0'

jobs:
  audit:
    # Using windows-latest to mirror the local development environment
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # v3 key forces a fresh cache to ensure requirements.txt changes are applied
          key: ${{ runner.os }}-pip-v3-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Attempt to install requirements; allow failure for complex wheels
          if (Test-Path requirements.txt) { pip install -r requirements.txt || true }

      - name: Run pip-audit and Generate HTML
        run: |
          # Install audit and reporting tools
          python -m pip install pip-audit markdown --disable-pip-version-check
          
          # We remove the backtick line breaks to eliminate whitespace errors
          pip-audit --local -f markdown --ignore-vuln CVE-2025-69872 -o audit_report.md || echo "Audit findings identified"
          
          # Convert the markdown audit to a readable HTML report
          if (Test-Path audit_report.md) {
            python -m markdown audit_report.md > security-report.html
          } else {
            echo "No audit report generated" > security-report.html
          }

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        run: |
          # This step is the "Enforcer".
          # We use a single line to ensure no hidden characters break the flags.
          pip-audit --local --ignore-vuln CVE-2025-69872