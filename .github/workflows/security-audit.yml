# GitHub Actions Workflow: Security Audit
# -----------------------------------------------------------------------------
# Performs a security scan of the Python environment using pip-audit.
# Enforces a security gate for the build while ignoring specific known CVEs.
# -----------------------------------------------------------------------------

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: Dependency Vulnerability Scan
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Audit Tools and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit markdown --disable-pip-version-check
          if (Test-Path requirements.txt) { pip install -r requirements.txt || true }

      - name: Run Scan and Generate Markdown Report
        shell: pwsh
        run: |
          # CVE-2025-69872 (diskcache) is ignored as an unpatched item.
          # The '|| echo' allows the workflow to proceed to the HTML conversion step.
          pip-audit --local -f markdown --ignore-vuln CVE-2025-69872 -o audit_report.md || echo "Findings handled"

      - name: Convert Markdown to HTML Report
        shell: pwsh
        run: |
          if (Test-Path audit_report.md) {
            python -m markdown audit_report.md > security-report.html
          }

      - name: Upload HTML Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        shell: pwsh
        run: |
# We define the ignore list as a clean PowerShell array
          $ignores = @("CVE-2025-69872")
          
          # Pass the array to the command
          pip-audit --local --ignore-vuln $ignores