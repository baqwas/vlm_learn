# GitHub Actions Workflow for VLM Project Security Auditing
# This workflow runs a security audit on Python dependencies using pip-audit.
# It is configured to ignore specific vulnerabilities that do not yet have
# official patches to prevent blocking the CI/CD pipeline unnecessarily.

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to catch new CVEs in existing dependencies
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We install requirements but ignore errors to allow the audit to proceed
          # even if certain complex wheels (like llama-cpp) fail to build.
          pip install -r requirements.txt || true

      - name: Run pip-audit and Generate HTML
        run: |
          pip install pip-audit markdown
          # Use --ignore-vuln to bypass the specific diskcache issue (CVE-2025-69872)
          # which currently lacks a patched version on PyPI.
          pip-audit --local -f markdown --ignore-vuln CVE-2025-69872 > audit_report.md || true
          python -m markdown audit_report.md > security-report.html

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        run: |
          # This step ensures the build fails if NEW, un-ignored vulnerabilities are found.
          # It continues to ignore the specific diskcache CVE to allow progress.
          pip-audit --local --ignore-vuln CVE-2025-69872