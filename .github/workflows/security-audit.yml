# GitHub Actions Workflow: Security Audit
# -----------------------------------------------------------------------------
# Performs a security scan of the Python environment using pip-audit.
# Uses .pip-audit.toml to manage "signed-off" or ignored vulnerabilities.
# -----------------------------------------------------------------------------

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: Dependency Vulnerability Scan
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Audit Tools and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit markdown --disable-pip-version-check
          if (Test-Path requirements.txt) { pip install -r requirements.txt || true }

      - name: Run Scan and Generate Markdown Report
        shell: pwsh
        run: |
          # The tool automatically picks up the 'ignore-vuln' list from .pip-audit.toml
          # The '|| echo' allows the workflow to generate the HTML report even if findings exist.
          pip-audit --local -f markdown -o audit_report.md || echo "Scan findings detected"

      - name: Convert Markdown to HTML Report
        shell: pwsh
        run: |
          if (Test-Path audit_report.md) {
            python -m markdown audit_report.md > security-report.html
          }

      - name: Upload HTML Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        shell: pwsh
        run: |
          # This step enforces the build status. 
          # It will only fail if a vulnerability is found that is NOT in your .toml file.
          pip-audit --local