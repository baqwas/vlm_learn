# GitHub Actions Workflow for VLM Project Security Auditing
# This workflow runs a security audit on Python dependencies using pip-audit.

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          key: ${{ runner.os }}-pip-v3-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt || true }

      - name: Run pip-audit and Generate HTML
        run: |
          python -m pip install pip-audit markdown --disable-pip-version-check
          pip-audit --local -f markdown --ignore-vuln CVE-2025-69872 -o audit_report.md || echo "Findings handled"
          if (Test-Path audit_report.md) { python -m markdown audit_report.md > security-report.html }

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html

      - name: Final Security Gate
        run: |
          pip-audit --local --ignore-vuln CVE-2025-69872